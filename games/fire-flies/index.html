<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firefly Jar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --night-0: #07131a;
    --night-1: #0f2f37;
    --glow: #ffd35a;
    --glow-core: #fff4c2;
    --rain: #7cc6ff;
    --ink: #e9f4ee;
    --ink-dim: #a3bdb8;
    --line: rgba(233, 244, 238, 0.16);
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }

  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--night-0);
    color: var(--ink);
    font-family: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  [hidden] { display: none !important; }

  #app {
    --u: 0.75px;
    height: 100%;
    box-sizing: border-box;
    padding: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  /* ---------- HUD ---------- */
  #hud {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    width: var(--stage-w, 360px);
    padding: 0 calc(var(--u) * 6);
    box-sizing: border-box;
  }

  .score-block {
    display: flex;
    align-items: center;
    gap: 0.5em;
    font-size: max(26px, calc(var(--u) * 40));
  }

  #score {
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    display: inline-block;
  }

  #score.bump { animation: bump 0.2s ease-out; }

  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  #mult {
    font-size: 0.42em;
    font-weight: 800;
    padding: 0.2em 0.6em;
    border-radius: 999px;
    background: var(--glow);
    color: #1b1300;
  }

  .best {
    font-size: max(12px, calc(var(--u) * 15));
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  #lights {
    justify-self: end;
    display: flex;
    gap: calc(var(--u) * 10);
  }

  #lights i {
    width: max(12px, calc(var(--u) * 16));
    height: max(12px, calc(var(--u) * 16));
    border-radius: 50%;
    background: var(--glow);
    box-shadow: 0 0 14px 2px rgba(255, 211, 90, 0.7);
    border: 1px solid transparent;
    transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
  }

  #lights i.off {
    background: transparent;
    box-shadow: none;
    border-color: var(--line);
  }

  /* ---------- Stage ---------- */
  #stage {
    position: relative;
    width: var(--stage-w, 360px);
    height: var(--stage-h, 540px);
    border-radius: calc(var(--u) * 24);
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0, 0, 0, 0.5);
    touch-action: none;
    background: var(--night-1);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* ---------- Panel ---------- */
  #panel {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: calc(var(--u) * 28);
    box-sizing: border-box;
    font-size: max(14px, calc(var(--u) * 18));
    background: radial-gradient(
      ellipse at 50% 42%,
      rgba(7, 19, 26, 0.5),
      rgba(7, 19, 26, 0.9)
    );
    animation: panel-in 0.35s ease-out;
  }

  @keyframes panel-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  #panel h1 {
    margin: 0 0 0.35em;
    font-size: max(32px, calc(var(--u) * 54));
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.025em;
    color: var(--glow-core);
    text-shadow: 0 0 28px rgba(255, 211, 90, 0.55);
  }

  #p-body {
    margin: 0;
    max-width: 32ch;
    line-height: 1.45;
  }

  #p-legend {
    list-style: none;
    margin: 1.2em 0 0;
    padding: 0;
    display: grid;
    gap: 0.55em;
    text-align: left;
    font-size: 0.92em;
    color: var(--ink-dim);
  }

  #p-legend li {
    display: flex;
    align-items: center;
    gap: 0.75em;
  }

  .dot {
    flex: none;
    width: 1.3em;
    height: 1.3em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .dot.fire {
    border-radius: 50%;
    background: radial-gradient(
      circle,
      #fff4c2 24%,
      #ffd35a 50%,
      transparent 72%
    );
  }

  .dot.gold {
    border-radius: 50%;
    background: radial-gradient(
      circle,
      #fff 14%,
      #ffb43a 46%,
      transparent 72%
    );
  }

  .dot.rain::before {
    content: '';
    width: 0.7em;
    height: 0.7em;
    border-radius: 0 50% 50% 50%;
    transform: rotate(45deg);
    background: linear-gradient(#cfeaff, #4aa3f0);
  }

  .dot.mult {
    font-weight: 800;
    color: var(--glow);
  }

  #p-btn {
    margin-top: 1.5em;
    font: inherit;
    font-weight: 800;
    font-size: max(16px, calc(var(--u) * 21));
    padding: 0.65em 1.9em;
    border: 0;
    border-radius: 999px;
    background: var(--glow);
    color: #1b1300;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(255, 211, 90, 0.4);
    transition: background 0.15s, transform 0.1s;
  }

  #p-btn:hover { background: var(--glow-core); }
  #p-btn:active { transform: translateY(1px); }
  #p-btn:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 3px;
  }

  #p-hint {
    margin: 1em 0 0;
    font-size: 0.82em;
    color: var(--ink-dim);
    max-width: 34ch;
    line-height: 1.4;
  }

  @media (prefers-reduced-motion: reduce) {
    #score.bump, #panel { animation: none; }
  }
</style>
</head>

<body>
<div id="app">

  <header id="hud">
    <div class="score-block">
      <span id="score">0</span>
      <span id="mult" hidden>×2</span>
    </div>

    <div class="best">
      Best <span id="best">0</span>
    </div>

    <div id="lights" role="img" aria-label="Lights remaining">
      <i></i><i></i><i></i>
    </div>
  </header>

  <main id="stage">
    <canvas id="game" role="img" aria-label="Firefly Jar game area"></canvas>

    <div id="panel" role="dialog" aria-labelledby="p-title">
      <h1 id="p-title">Firefly jar</h1>
      <p id="p-body"></p>

      <ul id="p-legend">
        <li><span class="dot fire"></span>Firefly: 1 point</li>
        <li><span class="dot gold"></span>Golden firefly: 5 points, slows time</li>
        <li><span class="dot rain"></span>Raindrop: puts a light out</li>
        <li><span class="dot mult">×</span>Six catches in a row raises your multiplier</li>
      </ul>

      <button id="p-btn" type="button">Start</button>
      <p id="p-hint"></p>
    </div>
  </main>
</div>

<script>
(() => {
'use strict';

const W = 480, H = 720, TAU = Math.PI * 2;
const MISS_Y = H - 54;
const JAR_LOW = H - 32;
const JAR_HIGH = 190;
const FONT = "'Bricolage Grotesque', system-ui, sans-serif";

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const app = $('app'), hud = $('hud'), stage = $('stage'), canvas = $('game');
const ctx = canvas.getContext('2d');
const scoreEl = $('score'), multEl = $('mult'), bestEl = $('best');
const lightEls = [...document.querySelectorAll('#lights i')];
const panel = $('panel'), pTitle = $('p-title'), pBody = $('p-body');
const pLegend = $('p-legend'), pBtn = $('p-btn'), pHint = $('p-hint');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let best = 0;
try {
  best = parseInt(localStorage.getItem('firefly-jar-best') || '0', 10) || 0;
} catch (e) {}

/* ---------------- state ---------------- */
const state = {
  mode: 'ready',
  t: 0,
  score: 0,
  caught: 0,
  lights: 3,
  streak: 0,
  slow: 0,
  spawn: 0,
  shake: 0,
  flash: 0,
  flashRgb: '0,0,0',
  pulse: 0,
  overAt: 0,
  items: [],
  parts: [],
  texts: []
};

const jar = {
  x: W / 2,
  y: JAR_LOW,
  target: W / 2,
  targetY: JAR_LOW,
  prevX: W / 2,
  prevY: JAR_LOW,
  w: 84,
  h: 92,
  tilt: 0,
  glow: 0.1
};

const keys = {
  l: false,
  r: false,
  u: false,
  d: false
};

/* ---------------- scenery ---------------- */

const stars = Array.from({ length: 70 }, () => ({
  x: rand(0, W),
  y: rand(0, H * 0.6),
  r: rand(0.4, 1.3),
  p: rand(0, TAU),
  s: rand(0.6, 1.8)
}));

const makeBlades = (n, minH, maxH) =>
  Array.from({ length: n }, (_, i) => ({
    x: (i / (n - 1)) * W + rand(-6, 6),
    h: rand(minH, maxH),
    w: rand(3, 6),
    p: rand(0, TAU),
    lean: rand(-6, 6)
  }));

const backBlades = makeBlades(72, 16, 42);
const frontBlades = makeBlades(58, 10, 28);

const ambient = Array.from({ length: 16 }, () => ({
  x: rand(0, W),
  y: rand(H * 0.25, H * 0.85),
  vx: rand(-8, 8),
  vy: rand(-8, 8),
  p: rand(0, TAU)
}));

let ambientAlpha = 1;

const moon = document.createElement('canvas');
moon.width = moon.height = 240;

(() => {
  const m = moon.getContext('2d');

  m.fillStyle = '#f3efd6';
  m.beginPath();
  m.arc(120, 120, 68, 0, TAU);
  m.fill();

  m.globalCompositeOperation = 'destination-out';

  m.beginPath();
  m.arc(148, 104, 60, 0, TAU);
  m.fill();
})();

const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
skyGrad.addColorStop(0, '#06111a');
skyGrad.addColorStop(0.55, '#0e2d36');
skyGrad.addColorStop(1, '#1a4b4a');

const jarPath = (() => {
  const w = jar.w, h = jar.h, nw = w * 0.74, p = new Path2D();

  p.moveTo(-nw / 2, -h);
  p.lineTo(-nw / 2, -h * 0.86);
  p.quadraticCurveTo(-w / 2, -h * 0.82, -w / 2, -h * 0.64);
  p.lineTo(-w / 2, -14);
  p.quadraticCurveTo(-w / 2, 0, -w / 2 + 14, 0);
  p.lineTo(w / 2 - 14, 0);
  p.quadraticCurveTo(w / 2, 0, w / 2, -14);
  p.lineTo(w / 2, -h * 0.64);
  p.quadraticCurveTo(w / 2, -h * 0.82, nw / 2, -h * 0.86);
  p.lineTo(nw / 2, -h);

  return p;
})();

/* ---------------- helpers ---------------- */

const mult = () => Math.min(5, 1 + Math.floor(state.streak / 6));

function setHud(bump) {
  scoreEl.textContent = state.score;

  const m = mult();

  multEl.hidden = m < 2;
  multEl.textContent = '×' + m;

  bestEl.textContent = Math.max(best, state.score);

  lightEls.forEach((el, i) =>
    el.classList.toggle('off', i >= state.lights)
  );

  if (bump) {
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
  }
}

function burst(x, y, n, rgb) {
  if (reduceMotion) n = Math.ceil(n / 3);

  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const s = rand(30, 150);

    state.parts.push({
      x,
      y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 30,
      life: 0,
      max: rand(0.4, 0.9),
      r: rand(1.2, 3),
      rgb
    });
  }
}

function floatText(text, x, y, color, size) {
  state.texts.push({
    text,
    x,
    y,
    color,
    size: size || 18,
    life: 0,
    max: 0.9
  });
}

/* ---------------- game flow ---------------- */

function showPanel(mode) {
  panel.hidden = false;
  pLegend.hidden = mode !== 'ready';

  if (mode === 'ready') {
    pTitle.textContent = 'Firefly jar';

    pBody.textContent =
      'Move your jar to meet the falling fireflies. Each one that reaches the grass puts out a light.';

    pBtn.textContent = 'Start';

    pHint.textContent =
      'Drag on the screen, move your mouse, or use the arrow keys. The jar moves up and down too.';

  } else if (mode === 'over') {
    pTitle.textContent = 'Lights out';

    const newBest =
      state.score > 0 &&
      state.score >= best &&
      state.isNewBest;

    pBody.textContent =
      `You caught ${state.caught} firefl${state.caught === 1 ? 'y' : 'ies'} and scored ${state.score}. ` +
      (newBest ? 'That is a new best.' : `Your best is ${best}.`);

    pBtn.textContent = 'Play again';

    pHint.textContent = 'Press space to go again.';

  } else {
    pTitle.textContent = 'Paused';
    pBody.textContent = 'Your fireflies are waiting.';
    pBtn.textContent = 'Resume';
    pHint.textContent = 'Press P to resume.';
  }

  pBtn.focus({ preventScroll: true });
}

function start() {
  Object.assign(state, {
    mode: 'playing',
    score: 0,
    caught: 0,
    lights: 3,
    streak: 0,
    slow: 0,
    spawn: 0.5,
    shake: 0,
    flash: 0,
    pulse: 0,
    isNewBest: false,
    items: [],
    parts: [],
    texts: []
  });

  jar.glow = 0.1;
  jar.target = jar.x;
  jar.targetY = jar.y;

  panel.hidden = true;
  pBtn.blur();

  setHud();
}

function pause() {
  if (state.mode === 'playing') {
    state.mode = 'paused';
    showPanel('paused');
  }
}

function resume() {
  if (state.mode === 'paused') {
    state.mode = 'playing';
    panel.hidden = true;
    pBtn.blur();
  }
}

function gameOver() {
  state.mode = 'over';
  state.overAt = performance.now();
  state.isNewBest = state.score > best;

  if (state.isNewBest) {
    best = state.score;

    try {
      localStorage.setItem('firefly-jar-best', String(best));
    } catch (e) {}
  }

  setHud();
  showPanel('over');
}

function loseLight(rgb) {
  state.lights--;
  state.streak = 0;
  state.shake = 0.3;
  state.flash = 0.35;
  state.flashRgb = rgb;

  setHud();

  if (state.lights <= 0) {
    gameOver();
  }
}

function onCatch(it) {
  if (it.type === 'drop') {
    burst(it.x, it.y, 14, '124,198,255');
    floatText('Soaked', it.x, it.y - 16, '#9fd6ff', 18);
    loseLight('124,198,255');
    return;
  }

  const gold = it.type === 'gold';

  state.streak++;
  state.caught++;

  const pts = (gold ? 5 : 1) * mult();

  state.score += pts;
  state.pulse = 1;

  burst(
    it.x,
    it.y,
    gold ? 22 : 10,
    gold ? '255,180,58' : '255,224,130'
  );

  floatText(
    '+' + pts,
    it.x,
    it.y - 18,
    gold ? '#ffd58a' : '#fff4c2',
    gold ? 24 : 18
  );

  if (gold) {
    state.slow = 3;
  }

  if (state.caught % 25 === 0 && state.lights < 3) {
    state.lights++;

    floatText(
      'Light back',
      jar.x,
      jar.y - jar.h - 40,
      '#fff4c2',
      20
    );
  }

  setHud(true);
}

function onMiss(it) {
  if (it.type === 'drop') {
    burst(it.x, MISS_Y, 6, '124,198,255');
    return;
  }

  burst(it.x, MISS_Y, 8, '200,180,110');
  floatText('Light out', it.x, MISS_Y - 22, '#d9cfa0', 16);
  loseLight('0,0,0');
}

function spawn() {
  const level = Math.floor(state.caught / 10);

  const hazardChance =
    state.caught < 5
      ? 0
      : Math.min(0.3, 0.08 + level * 0.03);

  let type = 'fly';

  if (Math.random() < hazardChance) {
    type = 'drop';
  } else if (state.caught >= 8 && Math.random() < 0.06) {
    type = 'gold';
  }

  /* FASTER FIREFLIES */
  const speed = Math.min(320, 120 + level * 14);

  const x0 = rand(30, W - 30);

  /*
    ONLY fireflies are doubled.
    Raindrops stay at their original speed.
  */
  const fireflyMultiplier =
    type === 'drop' ? 1 : 2;

  state.items.push({
    type,
    x0,
    x: x0,
    y: -20,
    t: 0,
    phase: rand(0, TAU),
    freq: rand(1.2, 2.6),
    amp: type === 'drop' ? 0 : rand(8, 30),

    vy:
      speed *
      fireflyMultiplier *
      (
        type === 'drop'
          ? 1.35
          : type === 'gold'
            ? 0.9
            : rand(1.0, 1.3)
      ),

    r:
      type === 'gold'
        ? 11
        : type === 'drop'
          ? 9
          : 7,

    /*
      New physical dragging state.
      This does not change the appearance
      or normal behavior of the firefly.
    */
    dragging: false,
    dragOffsetX: 0,
    dragOffsetY: 0
  });
}

/* ---------------- jar collision / dragging ---------------- */

/*
  Checks ONLY the physical sides and bottom
  of the jar.

  This is deliberately separate from the
  opening collision so touching the glass
  can NEVER count as a catch.
*/
function touchesJarBody(it) {
  if (it.type === 'drop') return false;

  const bodyTop =
    jar.y - jar.h + 7;

  const bodyBottom =
    jar.y;

  const bodyLeft =
    jar.x - jar.w / 2;

  const bodyRight =
    jar.x + jar.w / 2;

  const sideThickness = 10;
  const bottomThickness = 10;

  const verticalOverlap =
    it.y + it.r > bodyTop &&
    it.y - it.r < bodyBottom;

  const horizontalOverlap =
    it.x + it.r > bodyLeft &&
    it.x - it.r < bodyRight;

  const leftTouch =
    verticalOverlap &&
    it.x + it.r >= bodyLeft &&
    it.x <= bodyLeft + sideThickness;

  const rightTouch =
    verticalOverlap &&
    it.x - it.r <= bodyRight &&
    it.x >= bodyRight - sideThickness;

  const bottomTouch =
    horizontalOverlap &&
    it.y + it.r >= bodyBottom - bottomThickness &&
    it.y - it.r <= bodyBottom + bottomThickness;

  return (
    leftTouch ||
    rightTouch ||
    bottomTouch
  );
}


/*
  ONLY the actual mouth/opening can catch.

  The old game used a huge collision zone extending
  52px below the mouth, which meant the sides and
  bottom could effectively catch things.

  This checks that the firefly crosses the mouth
  from ABOVE.
*/
function reachesJarOpening(it) {
  const mouthY =
    jar.y - jar.h + 4;

  const previousMouthY =
    jar.prevY - jar.h + 4;

  const mouthTop =
    Math.min(
      mouthY,
      previousMouthY
    );

  const mouthBottom =
    Math.max(
      mouthY,
      previousMouthY
    );

  /*
    Opening is narrower than the entire jar body.
  */
  const mouthHalf =
    jar.w * 0.37;

  const xLo =
    Math.min(
      jar.x,
      jar.prevX
    ) - mouthHalf;

  const xHi =
    Math.max(
      jar.x,
      jar.prevX
    ) + mouthHalf;

  /*
    The firefly must have been above
    the opening and then cross it.
  */
  const wasAbove =
    it.y - it.r <= mouthTop;

  const reachedOpening =
    it.y + it.r >= mouthTop;

  /*
    Prevent catching objects that have already
    travelled down the glass/body.
  */
  const stillAtOpening =
    it.y - it.r <=
    mouthBottom + 5;

  const insideOpening =
    it.x >= xLo &&
    it.x <= xHi;

  return (
    !it.dragging &&
    wasAbove &&
    reachedOpening &&
    stillAtOpening &&
    insideOpening &&
    it.vy > 0
  );
}

/* ---------------- update ---------------- */

function update(dt) {
  state.t += dt;

  // jar
  const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);

  if (dir) {
    jar.target = clamp(
      jar.target + dir * 560 * dt,
      jar.w / 2,
      W - jar.w / 2
    );
  }

  const vdir = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);

  if (vdir) {
    jar.targetY = clamp(
      jar.targetY + vdir * 520 * dt,
      JAR_HIGH,
      JAR_LOW
    );
  }

  jar.prevX = jar.x;
  jar.prevY = jar.y;

  const maxStep = 1100 * dt;
  const ease = 1 - Math.exp(-20 * dt);

  jar.x += clamp(
    (jar.target - jar.x) * ease,
    -maxStep,
    maxStep
  );

  jar.y += clamp(
    (jar.targetY - jar.y) * ease,
    -maxStep,
    maxStep
  );

  const vx =
    (jar.x - jar.prevX) /
    Math.max(dt, 0.001);

  jar.tilt +=
    (
      clamp(vx * 0.00035, -0.16, 0.16) -
      jar.tilt
    ) *
    (1 - Math.exp(-12 * dt));

  const glowTarget =
    Math.min(1, 0.1 + state.streak * 0.05);

  jar.glow +=
    (glowTarget - jar.glow) *
    (1 - Math.exp(-3 * dt));

  state.pulse = Math.max(
    0,
    state.pulse - dt * 2.5
  );

  // effects
  state.shake = Math.max(0, state.shake - dt);
  state.flash = Math.max(0, state.flash - dt * 1.4);

  for (let i = state.parts.length - 1; i >= 0; i--) {
    const p = state.parts[i];

    p.life += dt;

    if (p.life >= p.max) {
      state.parts.splice(i, 1);
      continue;
    }

    p.vx *= 0.97;
    p.vy = p.vy * 0.97 + 40 * dt;

    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }

  for (let i = state.texts.length - 1; i >= 0; i--) {
    state.texts[i].life += dt;

    if (state.texts[i].life >= state.texts[i].max) {
      state.texts.splice(i, 1);
    }
  }

  // ambient fireflies
  ambientAlpha +=
    (
      (state.mode === 'playing' ? 0 : 1) -
      ambientAlpha
    ) *
    (1 - Math.exp(-4 * dt));

  for (const a of ambient) {
    a.vx = clamp(
      a.vx + rand(-20, 20) * dt,
      -16,
      16
    );

    a.vy = clamp(
      a.vy + rand(-20, 20) * dt,
      -16,
      16
    );

    a.x += a.vx * dt;
    a.y += a.vy * dt;

    if (a.x < -10) a.x = W + 10;
    if (a.x > W + 10) a.x = -10;

    a.y = clamp(a.y, H * 0.15, H * 0.9);
  }

  if (state.mode !== 'playing') return;

  const ts = state.slow > 0 ? 0.55 : 1;

  state.slow = Math.max(
    0,
    state.slow - dt
  );

  state.spawn -= dt * ts;

  if (state.spawn <= 0) {
    spawn();

    const level = Math.floor(state.caught / 10);

    state.spawn =
      Math.max(0.34, 1.0 - level * 0.06) *
      rand(0.7, 1.3);
  }


  /*
    -------------------------------
    NEW FIRELY/JAR PHYSICS
    -------------------------------
  */

  for (let i = state.items.length - 1; i >= 0; i--) {
    const it = state.items[i];

    it.t += dt * ts;

    /*
      Firefly keeps falling naturally.
    */
    it.y += it.vy * ts * dt;


    /*
      If the firefly is NOT currently being
      dragged, calculate its normal horizontal
      wandering exactly like the original game.
    */
    if (!it.dragging) {
      it.x = clamp(
        it.x0 +
        Math.sin(
          it.t * it.freq + it.phase
        ) * it.amp,
        14,
        W - 14
      );
    }


    /*
      TOP OPENING CATCH
      -----------------
      Check this BEFORE body dragging.

      If it enters through the mouth, catch it.
    */
    if (reachesJarOpening(it)) {
      state.items.splice(i, 1);

      onCatch(it);

      if (state.mode !== 'playing') return;

      continue;
    }


    /*
      PHYSICAL SIDE/BOTTOM CONTACT
      ----------------------------

      If the firefly hits the glass sides
      or bottom, attach it to the jar.

      It is NOT caught.
    */
    const touchingBody =
      touchesJarBody(it);


    if (touchingBody) {

      if (!it.dragging) {

        /*
          First frame of contact.

          Remember where the firefly is relative
          to the jar so it doesn't teleport.
        */
        it.dragging = true;

        it.dragOffsetX =
          it.x - jar.x;

        it.dragOffsetY =
          it.y - jar.y;
      }


      /*
        Transfer the jar's movement directly
        to the firefly.

        This creates the actual dragging effect.
      */
      it.x +=
        jar.x - jar.prevX;

      it.y +=
        jar.y - jar.prevY;


      /*
        Keep the firefly inside the screen.
        This only prevents impossible clipping
        at the extreme edges.
      */
      it.x = clamp(
        it.x,
        -30,
        W + 30
      );

    } else if (it.dragging) {

      /*
        The jar has moved away.

        Release the firefly.
      */
      it.dragging = false;


      /*
        Rebuild x0 so the firefly's original
        sinusoidal movement continues smoothly
        from its NEW position instead of snapping
        back to where it originally was.
      */
      const wave =
        Math.sin(
          it.t * it.freq +
          it.phase
        ) * it.amp;

      it.x0 =
        it.x - wave;
    }


    /*
      MISS DETECTION
      --------------

      The firefly only gets missed if it
      actually reaches the bottom of the game.

      Being dragged along the jar does NOT
      automatically remove it.
    */
    if (it.y - it.r > MISS_Y) {
      state.items.splice(i, 1);

      onMiss(it);

      if (state.mode !== 'playing') return;
    }
  }
}

/* ---------------- drawing ---------------- */

function glow(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(
    x, y, 0,
    x, y, r
  );

  g.addColorStop(
    0,
    `rgba(${rgb},${a})`
  );

  g.addColorStop(
    1,
    `rgba(${rgb},0)`
  );

  ctx.fillStyle = g;

  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
}

function drawHill(base, a, b, f1, f2, off, color) {
  ctx.fillStyle = color;

  ctx.beginPath();

  ctx.moveTo(0, H);

  for (let x = 0; x <= W; x += 8) {
    ctx.lineTo(
      x,
      base +
      Math.sin(x * f1 + off) * a +
      Math.sin(x * f2 + off * 2) * b
    );
  }

  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

function drawGrass(blades, baseY, color, swayAmt) {
  ctx.fillStyle = color;

  ctx.beginPath();

  ctx.moveTo(0, H);
  ctx.lineTo(0, baseY);

  for (const b of blades) {
    const sway =
      Math.sin(
        state.t * 1.2 + b.p
      ) * swayAmt;

    ctx.lineTo(
      b.x - b.w,
      baseY
    );

    ctx.lineTo(
      b.x + b.lean + sway,
      baseY - b.h
    );

    ctx.lineTo(
      b.x + b.w,
      baseY
    );
  }

  ctx.lineTo(W, baseY);
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

function drawFly(x, y, r, t, phase, gold) {
  const pulse =
    1 +
    0.18 *
    Math.sin(t * 5 + phase);

  ctx.globalCompositeOperation = 'lighter';

  glow(
    x,
    y + r * 0.4,
    r * (gold ? 6 : 4.6) * pulse,
    gold
      ? '255,180,58'
      : '255,211,90',
    gold
      ? 0.7
      : 0.55
  );

  ctx.globalCompositeOperation =
    'source-over';

  const flap =
    0.5 +
    0.5 *
    Math.sin(t * 38 + phase);

  ctx.fillStyle =
    'rgba(225,245,240,0.4)';

  ctx.beginPath();

  ctx.ellipse(
    x - r * 0.8,
    y - r * 0.7,
    r * 0.95,
    r * (0.18 + 0.3 * flap),
    -0.7,
    0,
    TAU
  );

  ctx.fill();

  ctx.beginPath();

  ctx.ellipse(
    x + r * 0.8,
    y - r * 0.7,
    r * 0.95,
    r * (0.18 + 0.3 * flap),
    0.7,
    0,
    TAU
  );

  ctx.fill();

  ctx.fillStyle = '#2b2418';

  ctx.beginPath();

  ctx.ellipse(
    x,
    y - r * 0.3,
    r * 0.45,
    r * 0.8,
    0,
    0,
    TAU
  );

  ctx.fill();

  ctx.fillStyle =
    gold
      ? '#fff0c8'
      : '#fff4c2';

  ctx.beginPath();

  ctx.arc(
    x,
    y + r * 0.55,
    r * 0.7,
    0,
    TAU
  );

  ctx.fill();

  if (gold) {
    ctx.strokeStyle =
      'rgba(255,220,140,0.6)';

    ctx.lineWidth = 1.5;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      r * 1.9 +
      Math.sin(t * 4) * 1.5,
      0,
      TAU
    );

    ctx.stroke();
  }
}

function drawDrop(x, y, r) {
  const g = ctx.createLinearGradient(
    x,
    y - r * 1.8,
    x,
    y + r * 1.4
  );

  g.addColorStop(0, '#d6f0ff');
  g.addColorStop(1, '#4aa3f0');

  ctx.shadowColor =
    'rgba(124,198,255,0.8)';

  ctx.shadowBlur = 12;

  ctx.fillStyle = g;

  ctx.beginPath();

  ctx.moveTo(
    x,
    y - r * 1.8
  );

  ctx.bezierCurveTo(
    x + r * 0.3,
    y - r * 0.9,
    x + r,
    y - r * 0.2,
    x + r,
    y + r * 0.4
  );

  ctx.arc(
    x,
    y + r * 0.4,
    r,
    0,
    Math.PI,
    false
  );

  ctx.bezierCurveTo(
    x - r,
    y - r * 0.2,
    x - r * 0.3,
    y - r * 0.9,
    x,
    y - r * 1.8
  );

  ctx.fill();

  ctx.shadowBlur = 0;
}

function drawJar() {
  const { x, y, w, h } = jar;
  const nw = w * 0.74;
  const g = jar.glow;
  const p = state.pulse;
  const t = state.t;

  ctx.globalCompositeOperation =
    'lighter';

  glow(
    x,
    y - h * 0.35,
    170,
    '255,211,90',
    0.06 + 0.22 * g + 0.25 * p
  );

  glow(
    x,
    y - 2,
    90,
    '255,211,90',
    0.1 + 0.25 * g
  );

  ctx.globalCompositeOperation =
    'source-over';

  ctx.save();

  ctx.translate(x, y);
  ctx.rotate(jar.tilt);

  // light inside the jar
  ctx.save();

  ctx.clip(jarPath);

  const level =
    (0.12 + 0.8 * g) *
    h *
    0.8;

  const lg =
    ctx.createLinearGradient(
      0,
      -level,
      0,
      0
    );

  lg.addColorStop(
    0,
    'rgba(255,211,90,0)'
  );

  lg.addColorStop(
    1,
    `rgba(255,211,90,${0.25 + 0.5 * g + 0.3 * p})`
  );

  ctx.fillStyle = lg;

  ctx.fillRect(
    -w / 2,
    -level,
    w,
    level
  );

  ctx.globalCompositeOperation =
    'lighter';

  glow(
    0,
    -14,
    w * 0.7,
    '255,211,90',
    0.25 + 0.5 * g + 0.3 * p
  );

  const n =
    2 + Math.floor(g * 7);

  for (let i = 0; i < n; i++) {
    const a =
      t * (0.6 + i * 0.13) +
      i * 1.7;

    const mx =
      Math.sin(a) *
      w * 0.28;

    const my =
      -h * 0.25 -
      (
        0.5 +
        0.5 *
        Math.sin(a * 1.3 + i)
      ) *
      h *
      0.45;

    ctx.fillStyle =
      'rgba(255,244,194,0.9)';

    ctx.beginPath();

    ctx.arc(
      mx,
      my,
      1.6 + (i % 2),
      0,
      TAU
    );

    ctx.fill();
  }

  ctx.globalCompositeOperation =
    'source-over';

  ctx.restore();

  // glass
  ctx.fillStyle =
    'rgba(200,235,235,0.08)';

  ctx.fill(jarPath);

  ctx.strokeStyle =
    'rgba(225,247,242,0.6)';

  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';

  ctx.stroke(jarPath);

  ctx.strokeStyle =
    'rgba(255,255,255,0.32)';

  ctx.lineWidth = 3;
  ctx.lineCap = 'round';

  ctx.beginPath();

  ctx.moveTo(
    -w / 2 + 9,
    -h * 0.58
  );

  ctx.lineTo(
    -w / 2 + 9,
    -24
  );

  ctx.stroke();

  ctx.strokeStyle =
    'rgba(235,250,246,0.75)';

  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.ellipse(
    0,
    -h,
    nw / 2,
    5,
    0,
    0,
    TAU
  );

  ctx.stroke();

  ctx.restore();
}

function draw() {
  const t = state.t;

  ctx.save();

  if (
    state.shake > 0 &&
    !reduceMotion
  ) {
    ctx.translate(
      rand(-1, 1) *
      state.shake *
      18,

      rand(-1, 1) *
      state.shake *
      18
    );
  }

  // sky
  ctx.fillStyle = skyGrad;

  ctx.fillRect(
    -24,
    -24,
    W + 48,
    H + 48
  );

  // moon
  ctx.globalCompositeOperation =
    'lighter';

  glow(
    392,
    96,
    110,
    '243,239,214',
    0.12
  );

  ctx.globalCompositeOperation =
    'source-over';

  ctx.globalAlpha = 0.92;

  ctx.drawImage(
    moon,
    332,
    36,
    120,
    120
  );

  ctx.globalAlpha = 1;

  // stars
  for (const s of stars) {
    ctx.globalAlpha =
      0.25 +
      0.6 *
      (
        0.5 +
        0.5 *
        Math.sin(
          t * s.s + s.p
        )
      );

    ctx.fillStyle =
      '#e9f4ee';

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.r,
      0,
      TAU
    );

    ctx.fill();
  }

  ctx.globalAlpha = 1;

  // land
  drawHill(
    H - 250,
    26,
    14,
    0.011,
    0.028,
    1.2,
    '#0e2b33'
  );

  drawHill(
    H - 170,
    22,
    10,
    0.014,
    0.033,
    4.1,
    '#0a2229'
  );

  drawGrass(
    backBlades,
    H - 46,
    '#08191d',
    3
  );

  // ambient fireflies
  if (ambientAlpha > 0.02) {
    ctx.globalAlpha =
      ambientAlpha * 0.8;

    for (const a of ambient) {
      drawFly(
        a.x,
        a.y,
        4,
        t,
        a.p,
        false
      );
    }

    ctx.globalAlpha = 1;
  }

  // falling things
  for (const it of state.items) {
    if (it.type === 'drop') {
      drawDrop(
        it.x,
        it.y,
        it.r
      );
    } else {
      drawFly(
        it.x,
        it.y,
        it.r,
        it.t,
        it.phase,
        it.type === 'gold'
      );
    }
  }

  drawJar();

  // sparks
  ctx.globalCompositeOperation =
    'lighter';

  for (const p of state.parts) {
    const a =
      1 - p.life / p.max;

    ctx.fillStyle =
      `rgba(${p.rgb},${a})`;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.r * (0.5 + a),
      0,
      TAU
    );

    ctx.fill();
  }

  ctx.globalCompositeOperation =
    'source-over';

  drawGrass(
    frontBlades,
    H - 34,
    '#040c0e',
    4
  );

  // floating text
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (const f of state.texts) {
    const k =
      f.life / f.max;

    ctx.globalAlpha =
      1 - k * k;

    ctx.fillStyle =
      f.color;

    ctx.font =
      `800 ${f.size}px ${FONT}`;

    ctx.fillText(
      f.text,
      clamp(
        f.x,
        50,
        W - 50
      ),
      f.y - k * 36
    );
  }

  ctx.globalAlpha = 1;

  if (state.flash > 0) {
    ctx.fillStyle =
      `rgba(${state.flashRgb},${state.flash * 0.5})`;

    ctx.fillRect(
      -24,
      -24,
      W + 48,
      H + 48
    );
  }

  ctx.restore();
}

/* ---------------- loop ---------------- */

let last = performance.now();

function frame(now) {
  const dt =
    Math.min(
      0.05,
      (now - last) / 1000
    );

  last = now;

  update(dt);
  draw();

  requestAnimationFrame(frame);
}

/* ---------------- sizing ---------------- */

function resize() {
  const cs =
    getComputedStyle(app);

  const padX =
    parseFloat(cs.paddingLeft) +
    parseFloat(cs.paddingRight);

  const padY =
    parseFloat(cs.paddingTop) +
    parseFloat(cs.paddingBottom);

  const gap =
    parseFloat(cs.rowGap) || 0;

  const availW =
    app.clientWidth - padX;

  app.style.setProperty(
    '--u',
    Math.min(
      availW / W,
      1.5
    ) + 'px'
  );

  const availH =
    app.clientHeight -
    padY -
    gap -
    hud.offsetHeight;

  const scale =
    Math.max(
      0.2,
      Math.min(
        availW / W,
        availH / H,
        1.5
      )
    );

  app.style.setProperty(
    '--u',
    scale + 'px'
  );

  const sw =
    Math.floor(W * scale);

  const sh =
    Math.floor(H * scale);

  app.style.setProperty(
    '--stage-w',
    sw + 'px'
  );

  app.style.setProperty(
    '--stage-h',
    sh + 'px'
  );

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.round(sw * dpr);

  canvas.height =
    Math.round(sh * dpr);

  ctx.setTransform(
    canvas.width / W,
    0,
    0,
    canvas.height / H,
    0,
    0
  );
}

/* ---------------- input ---------------- */

function pointerToX(e) {
  const r =
    canvas.getBoundingClientRect();

  jar.target =
    clamp(
      (e.clientX - r.left) /
      r.width *
      W,

      jar.w / 2,
      W - jar.w / 2
    );

  const py =
    (e.clientY - r.top) /
    r.height *
    H;

  const base =
    e.pointerType === 'touch'
      ? py - 12
      : py + jar.h / 2;

  jar.targetY =
    clamp(
      base,
      JAR_HIGH,
      JAR_LOW
    );
}

canvas.addEventListener(
  'pointermove',
  pointerToX
);

canvas.addEventListener(
  'pointerdown',
  e => {
    if (canvas.setPointerCapture) {
      try {
        canvas.setPointerCapture(
          e.pointerId
        );
      } catch (err) {}
    }

    pointerToX(e);
  }
);

pBtn.addEventListener(
  'click',
  () => {
    if (state.mode === 'paused') {
      resume();
    } else {
      start();
    }
  }
);

window.addEventListener(
  'keydown',
  e => {
    const k = e.key;

    if (
      k === 'ArrowLeft' ||
      k === 'a' ||
      k === 'A'
    ) {
      keys.l = true;
      e.preventDefault();

    } else if (
      k === 'ArrowRight' ||
      k === 'd' ||
      k === 'D'
    ) {
      keys.r = true;
      e.preventDefault();

    } else if (
      k === 'ArrowUp' ||
      k === 'w' ||
      k === 'W'
    ) {
      keys.u = true;
      e.preventDefault();

    } else if (
      k === 'ArrowDown' ||
      k === 's' ||
      k === 'S'
    ) {
      keys.d = true;
      e.preventDefault();

    } else if (
      k === 'p' ||
      k === 'P' ||
      k === 'Escape'
    ) {
      if (state.mode === 'playing') {
        pause();
      } else if (state.mode === 'paused') {
        resume();
      }

    } else if (
      (k === ' ' || k === 'Enter') &&
      e.target !== pBtn
    ) {
      if (state.mode === 'ready') {
        start();
        e.preventDefault();

      } else if (
        state.mode === 'over' &&
        performance.now() -
        state.overAt >
        600
      ) {
        start();
        e.preventDefault();

      } else if (
        state.mode === 'paused'
      ) {
        resume();
        e.preventDefault();

      } else if (
        state.mode === 'playing'
      ) {
        e.preventDefault();
      }
    }
  }
);

window.addEventListener(
  'keyup',
  e => {
    const k = e.key;

    if (
      k === 'ArrowLeft' ||
      k === 'a' ||
      k === 'A'
    ) {
      keys.l = false;
    }

    if (
      k === 'ArrowRight' ||
      k === 'd' ||
      k === 'D'
    ) {
      keys.r = false;
    }

    if (
      k === 'ArrowUp' ||
      k === 'w' ||
      k === 'W'
    ) {
      keys.u = false;
    }

    if (
      k === 'ArrowDown' ||
      k === 's' ||
      k === 'S'
    ) {
      keys.d = false;
    }
  }
);

window.addEventListener(
  'blur',
  () => {
    keys.l =
      keys.r =
      keys.u =
      keys.d =
      false;

    pause();
  }
);

document.addEventListener(
  'visibilitychange',
  () => {
    if (document.hidden) pause();
  }
);

window.addEventListener(
  'resize',
  resize
);

window.addEventListener(
  'orientationchange',
  resize
);

/* ---------------- go ---------------- */

resize();

if (
  document.fonts &&
  document.fonts.ready
) {
  document.fonts.fonts?.ready?.then(resize);
  document.fonts.ready.then(resize);
}

setHud();
showPanel('ready');

requestAnimationFrame(
  t => {
    last = t;
    requestAnimationFrame(frame);
  }
);

})();
</script>
</body>
</html>
